{{ define "main" }}
<div class="flex">
    <!-- Sidebar Navigation -->
    <div class="w-48 flex-shrink-0 pr-8 border-r border-slate-200 dark:border-slate-700">
        <h1 class="text-3xl font-bold text-slate-800 dark:text-slate-200 mb-8">Snippets</h1>
    </div>

    <!-- Main Content -->
    <div class="flex-grow pl-8">
        <article class="justify-self-center mx-auto mb-16 px-6 sm:px-4 md:px-0 prose dark:prose-invert prose-slate lg:prose-lg hover:prose-a:text-sky-500">
            <div class="flex justify-center">
                <img src="{{ .Params.img }}" 
                     alt="{{ .Title }}"
                     class="max-h-[600px] w-auto max-w-[800px] object-contain rounded-lg shadow-lg">
            </div>
            <div class="mt-3 text-center text-slate-600 dark:text-slate-400 text-sm">
                {{ .Params.caption }}
                {{ with .Date }}
                <span class="mx-2">·</span>{{ .Format "January 2, 2006" }}
                {{ end }}
                {{ with .Content }}
                <div class="mt-4">
                    {{ . }}
                </div>
                {{ end }}
            </div>
        </article>
    </div>
</div>
{{ end }}
